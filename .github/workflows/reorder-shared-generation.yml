name: Reorder Shared Generation

on:
  push:
    branches:
      - codex/shared-syntax-chunk-authority

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, 'Generate shared reorder artifacts') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/shared-syntax-chunk-authority
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: |
          python -m pip install --upgrade pip
          pip install "spacy==3.8.16"
          python -m spacy download en_core_web_sm
      - name: Generate shared reorder metadata
        run: python scripts/reorder/generate-reorder-metadata.py
      - name: Commit generated artifacts
        run: |
          if git diff --quiet -- data/reorder-v1.json data/reorder-report.json; then
            echo "Generated artifacts already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reorder-v1.json data/reorder-report.json
          git commit -m "Generate shared reorder artifacts"
          git push origin HEAD:codex/shared-syntax-chunk-authority
