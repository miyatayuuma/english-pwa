name: Debug vocabulary v2

on:
  push:
    paths:
      - '.github/workflows/debug-vocab-v2.yml'

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts wink-pos-tagger@2.2.2
      - name: Inspect tokens
        run: |
          node <<'NODE'
          const fs=require('fs');
          const tagger=require('wink-pos-tagger')();
          const items=JSON.parse(fs.readFileSync('data/items.json','utf8'));
          for(const id of ['E0001','E0002','E0003','E0004','E0007','E0011']){
            const item=items.find(x=>x.id===id);
            console.log('\n',id,item.en);
            console.log(tagger.tagSentence(item.en).map(t=>({v:t.value,n:t.normal,l:t.lemma,p:t.pos,tag:t.tag})));
          }
          for(const s of ['maintain','turn out','positive','origin','remind A of B','take a shower','tell A from B']){
            console.log('\nHEAD',s,tagger.tagSentence(s).map(t=>({v:t.value,n:t.normal,l:t.lemma,p:t.pos,tag:t.tag})));
          }
          NODE
