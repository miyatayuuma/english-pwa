name: Independent Gate A acceptance pinned source

on:
  push:
    branches: [diag/android-gate-a-capability-order-probe]

permissions:
  contents: read

jobs:
  gate-a:
    name: "Gate A ${{ matrix.label }} on pinned source"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: acceptance-1
            app_sha: 2130935ef68d314ccf3d183d520c8624951e4ab1
          - label: acceptance-2
            app_sha: 2130935ef68d314ccf3d183d520c8624951e4ab1
          - label: acceptance-3
            app_sha: 2130935ef68d314ccf3d183d520c8624951e4ab1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ matrix.app_sha }}"
      - name: Verify exact source SHA
        env:
          EXPECTED_SOURCE_SHA: "${{ matrix.app_sha }}"
        run: |
          actual="$(git rev-parse HEAD)"
          echo "GATE_A_SOURCE_SHA=$actual"
          test "$actual" = "$EXPECTED_SOURCE_SHA"
          grep -n "APP_VERSION" scripts/version.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run native:sync
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run all five Android Gate A tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: status=0; ./android/gradlew -p android :app:connectedDebugAndroidTest --no-daemon || status=$?; adb logcat -d > android-gate-logcat.txt; exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-gate-a-${{ matrix.label }}
          path: |
            android/app/build/reports/androidTests/connected/
            android-gate-logcat.txt
          if-no-files-found: error
