name: Application tests

on:
  push:
    paths:
      - 'index.html'
      - 'styles/**'
      - 'sw.js'
      - 'scripts/**'
      - 'data/reorder-v1.json'
      - 'data/reorder-report.json'
      - 'data/reorder-gold.json'
      - 'data/reorder-overrides.json'
      - 'data/vocabulary-v3.json'
      - 'data/vocabulary-v2-v3-migration.json'
      - 'data/items.json'
      - 'data/characters.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'styles/**'
      - 'sw.js'
      - 'scripts/**'
      - 'data/reorder-v1.json'
      - 'data/reorder-report.json'
      - 'data/reorder-gold.json'
      - 'data/reorder-overrides.json'
      - 'data/vocabulary-v3.json'
      - 'data/vocabulary-v2-v3-migration.json'
      - 'data/items.json'
      - 'data/characters.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - '.github/workflows/test.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser-test dependency
        run: npm ci
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run unit and pointer-browser tests
        run: node --experimental-default-type=module --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned syntax parser
        run: |
          python -m pip install 'spacy==3.8.16'
          python -m spacy download en_core_web_sm
      - name: Regenerate reorder data for source-sync
        run: python scripts/reorder/generate-reorder-metadata.py
      - name: Commit regenerated reorder artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reorder-v1.json data/reorder-report.json
          if git diff --cached --quiet; then
            echo "Reorder artifacts already current."
          else
            git commit -m "Sync reorder metadata after source repairs"
            git push origin HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          fi
      - name: Validate the full corpus and gold fixtures
        run: |
          node scripts/reorder/validate-reorder-metadata.mjs
          python scripts/reorder/validate-reorder-gold.py
