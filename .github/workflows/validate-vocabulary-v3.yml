name: Validate curated vocabulary v3

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/items.json'
      - 'data/characters.json'
      - 'data/vocabulary-v3.json'
      - 'data/vocabulary-v3-final-admission-occurrences.json'
      - 'data/vocabulary-v3-paraphrase-audit.json'
      - 'data/vocabulary-v3-report.json'
      - 'data/vocabulary-v2-v3-migration.json'
      - 'data/sentence-pattern-analysis.json'
      - 'scripts/app/vocabulary*.js'
      - 'scripts/vocabulary/**'
      - 'data/vocabulary*.json'
      - 'scripts/vocabulary/validate-final-admission-occurrences.mjs'
      - 'scripts/vocabulary/validate-source-sentence-integrity.mjs'
      - 'scripts/tagging/sentencePatternApplication.mjs'
      - 'scripts/app/clozeLearningCore.js'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-vocabulary-v3.yml'
  pull_request:
    paths:
      - 'data/items.json'
      - 'data/characters.json'
      - 'data/vocabulary-v3.json'
      - 'data/vocabulary-v3-final-admission-occurrences.json'
      - 'data/vocabulary-v3-paraphrase-audit.json'
      - 'data/vocabulary-v3-report.json'
      - 'data/vocabulary-v2-v3-migration.json'
      - 'data/sentence-pattern-analysis.json'
      - 'scripts/app/vocabulary*.js'
      - 'scripts/vocabulary/**'
      - 'data/vocabulary*.json'
      - 'scripts/vocabulary/validate-final-admission-occurrences.mjs'
      - 'scripts/vocabulary/validate-source-sentence-integrity.mjs'
      - 'scripts/tagging/sentencePatternApplication.mjs'
      - 'scripts/app/clozeLearningCore.js'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-vocabulary-v3.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm ci
      - name: Check derived vocabulary artifacts
        run: npm run vocab:check-derived
      - name: Validate vocabulary and source sentence integrity
        run: npm run vocab:validate
      - name: Run application tests
        run: npm test
