name: Android shell build

on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'capacitor.config.json', 'scripts/**', 'styles/**', 'index.html', 'data/**', 'package*.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'capacitor.config.json', 'scripts/**', 'styles/**', 'index.html', 'data/**', 'package*.json', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run native:sync
      - run: ./android/gradlew -p android assembleDebug assembleRelease lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: english-pwa-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  gate-a-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run native:sync
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./android/gradlew -p android connectedDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-gate-a-results
          path: android/app/build/reports/androidTests/connected/
