name: Patch adaptive fallback

on:
  push:
    paths:
      - '.github/trigger-adaptive-fallback'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch fallback support
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='scripts/app/tagMode.js';
          let src=fs.readFileSync(path,'utf8');
          const pattern=/if\(!state\.fallbackUsed\.has\(id\)\)\{[\s\S]*?state\.fallbackUsed\.add\(id\);[\s\S]*?setTimeout\(\(\)=>\{ if\(state\.currentItemId===id\) dispatchDownSwipe\(\{automatic:true\}\); \},130\);[\s\S]*?\n\s*\}/;
          const replacement=`if(!state.fallbackUsed.has(id)){
              state.fallbackUsed.add(id);
              const en=document.getElementById('enText');
              const ja=document.getElementById('jaText');
              const englishHidden=!!en?.classList.contains('concealed');
              const japaneseHidden=!ja || ja.style.display==='none' || getComputedStyle(ja).display==='none';
              if(englishHidden || japaneseHidden){
                setTimeout(()=>{ if(state.currentItemId===id) dispatchDownSwipe({automatic:true}); },130);
              }
            }`;
          if(!pattern.test(src)) throw new Error('Expected fallback snippet not found');
          fs.writeFileSync(path,src.replace(pattern,replacement));
          NODE
      - name: Test
        run: node --experimental-default-type=module --test tests/*.test.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/app/tagMode.js
          git commit -m "fix: avoid cycling adaptive hints after failure" || exit 0
          git push
