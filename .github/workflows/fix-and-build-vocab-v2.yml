name: Fix and build vocabulary v2

on:
  push:
    paths:
      - '.github/workflows/fix-and-build-vocab-v2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix first-anchor matching
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/vocabulary/build-duo-vocabulary-v2.mjs')
          s=p.read_text()
          old="""function orderedSubsequence(anchors,tokens,maxGap=8){
            if(!anchors.length) return false;
            let pos=-1;
            for(const anchor of anchors){
              let found=-1;
              for(let i=pos+1;i<tokens.length&&i<=pos+1+maxGap;i++){
                if(tokens[i]===anchor){ found=i; break; }
              }
              if(found<0) return false; pos=found;
            }
            return true;
          }"""
          new="""function orderedSubsequence(anchors,tokens,maxGap=8){
            if(!anchors.length) return false;
            let pos=-1;
            for(let ai=0;ai<anchors.length;ai+=1){
              const anchor=anchors[ai];
              let found=-1;
              const start=pos+1;
              const end=ai===0 ? tokens.length-1 : Math.min(tokens.length-1,pos+maxGap+1);
              for(let i=start;i<=end;i+=1){
                if(tokens[i]===anchor){ found=i; break; }
              }
              if(found<0) return false;
              pos=found;
            }
            return true;
          }"""
          if old not in s:
              raise SystemExit('orderedSubsequence block not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Install dependencies
        run: npm install --no-save --ignore-scripts wink-pos-tagger@2.2.2 cheerio@1.0.0
      - name: Fetch dictionary and public indexes
        run: |
          mkdir -p .tmp
          git clone --depth 1 https://github.com/kujirahand/EJDict.git .tmp/EJDict
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://english4ed.blog.jp/archives/9673172.html' -o .tmp/duo-index-1.html
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://english4ed.blog.jp/archives/9673230.html' -o .tmp/duo-index-2.html
          python - <<'PY'
          import re
          from pathlib import Path
          for name in ('.tmp/duo-index-1.html','.tmp/duo-index-2.html'):
              p=Path(name); s=p.read_text(encoding='utf-8',errors='ignore')
              s=re.sub(r'(?i)<br\s*/?>','\n',s)
              s=re.sub(r'(?i)</(?:p|div|li|tr|td|h[1-6])>','\n',s)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Build
        env:
          EJDICT_DIR: .tmp/EJDict/src
        run: node scripts/vocabulary/build-duo-vocabulary-v2.mjs
      - name: Validate
        run: |
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('data/vocabulary-v2-report.json','utf8'));
          if(r.source_index_rows!==2569) throw new Error(`expected 2569 index rows, got ${r.source_index_rows}`);
          if(r.matched_entries<2100) throw new Error(`matching still too low: ${r.matched_entries}`);
          if(r.phrases<800) throw new Error(`phrase matching still too low: ${r.phrases}`);
          console.log(r);
          NODE
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/vocabulary/build-duo-vocabulary-v2.mjs data/vocabulary-v2.json data/vocabulary-v2-report.json
          git commit -m 'data: improve DUO vocabulary example matching'
          git push
