name: Build vocabulary database

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/vocabulary/build-vocabulary.mjs'
      - '.github/workflows/build-vocabulary-db.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install NLP dependency
        run: npm install --no-save --ignore-scripts wink-pos-tagger@2.2.2
      - name: Fetch CC0 English-Japanese dictionary
        run: |
          mkdir -p .tmp
          git clone --depth 1 https://github.com/kujirahand/EJDict.git .tmp/EJDict
      - name: Generate vocabulary database
        env:
          EJDICT_DIR: .tmp/EJDict/src
        run: node scripts/vocabulary/build-vocabulary.mjs
      - name: Validate vocabulary database
        run: |
          node <<'NODE'
          const fs=require('fs');
          const items=JSON.parse(fs.readFileSync('data/items.json','utf8'));
          const db=JSON.parse(fs.readFileSync('data/vocabulary.json','utf8'));
          const report=JSON.parse(fs.readFileSync('data/vocabulary-report.json','utf8'));
          const ids=new Set(items.map(x=>x.id));
          if(db.schema_version!==1 || !Array.isArray(db.entries)) throw new Error('invalid database schema');
          if(db.entries.length<500) throw new Error(`too few entries: ${db.entries.length}`);
          if(!db.entries.some(x=>x.kind==='phrase')) throw new Error('no phrase entries');
          if(db.entries.some(x=>!x.id||!x.headword||!x.meaning_ja||!Array.isArray(x.example_ids)||!x.example_ids.length)) throw new Error('incomplete entry');
          if(db.entries.some(x=>x.example_ids.some(id=>!ids.has(id)))) throw new Error('unknown example id');
          if(report.total_example_sentences!==560) throw new Error(`expected 560 examples, got ${report.total_example_sentences}`);
          console.log(`validated ${db.entries.length} vocabulary entries (${report.words} words, ${report.phrases} phrases)`);
          NODE
      - name: Commit generated database
        run: |
          if [ -z "$(git status --porcelain -- data/vocabulary.json data/vocabulary-report.json)" ]; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vocabulary.json data/vocabulary-report.json
          git commit -m 'data: build vocabulary database from example sentences'
          git push
